receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 512
exporters:
  debug:
    verbosity: basic
  file/telemetry:
    path: /var/log/otel/telemetry.jsonl
    rotation:
      max_megabytes: 100
      max_days: 7
      max_backups: 3
  otlphttp/logiq:
    endpoint: http://collection:8000
    logs_endpoint: http://collection:8000/v1/otlp/logs
    encoding: proto
    headers:
      x-logiq-otlp-token: ${env:LOGIQ_OTLP_INGEST_TOKEN}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000
service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, file/telemetry, otlphttp/logiq]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
